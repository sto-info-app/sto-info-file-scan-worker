# Render Blueprint for the STO Info Staging project, "tribble": the Fleet
# Community branch deployed whole. The same image and the same fixed values as
# render/production.yaml, which says why each is what it is; what differs is
# the branch, the environment, and that its database and Redis are the staging
# backend's, declared in that repository's blueprint and so set here by hand.
# A Blueprint instance reads this file from the sr/sc-1036-fleet-community
# branch, with its path given in the dashboard's Blueprint Path field.

services:
  - type: worker
    name: sto-info-file-scan-worker-tribble
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: frankfurt
    branch: sr/sc-1036-fleet-community
    # Deployed by hand, after the backend: its first migration needs the
    # backend's tables.
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: staging
      - key: LOG_LEVEL
        value: log
      - key: FILE_SCAN_SCHEMA_VERSION
        value: 2
      - key: DB_SCHEMA
        value: sto_info_worker
      - key: TYPEORM_SYNCHRONIZE
        value: false
      - key: SCAN_CONCURRENCY
        value: 1
      - key: CLAMAV_HOST
        value: 127.0.0.1
      - key: CLAMAV_PORT
        value: 3310
      - key: CLAMAV_MAX_DEFINITION_AGE_HOURS
        value: 48
      - key: CLAMAV_HEALTH_POLL_MS
        value: 30000
      - key: SCAN_UNHEALTHY_RETRY_MS
        value: 60000
      - key: WORKER_HEARTBEAT_INTERVAL_MS
        value: 30000
      - key: STRANDED_VERDICT_RESEND_INTERVAL_MS
        value: 600000
      # Must match the backend's.
      - key: QUEUE_PREFIX
        value: 'bull:sto-info:'

      # The staging backend's database and Redis, from its dashboard: the
      # worker's own role in the database (DB_USERNAME), and the backend's
      # role (BACKEND_DB_ROLE, `sto_info_app_tribble_user`).
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: BACKEND_DB_ROLE
        sync: false
      - key: REDIS_URL
        sync: false

      - key: CLOUDFLARE_R2_ENDPOINT
        sync: false
      - key: CLOUDFLARE_R2_QUARANTINE_BUCKET_NAME
        sync: false

      # Its own secret: the worker role's password and the read-only
      # quarantine token.
      - key: AWS_SECRET_NAME
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
