# freshclam, as this worker needs it.
#
# ADR-0005 decision 4 is the whole of the policy here: **an update failure
# must never cause files to be marked clean using stale definitions.** That
# is not enforced in this file and cannot be — it is enforced by the worker,
# which refuses to scan with signatures older than
# CLAMAV_MAX_DEFINITION_AGE_HOURS and pauses its queue while they are. What
# this file decides is only how often the attempt is made and how loudly it
# fails.

# Supervised by s6, so it stays in the foreground.
#
# No UpdateLogFile, for the same reason clamd.conf has no LogFile: freshclam
# opens the path by name and /dev/stdout is a symlink chain it refuses. In
# the foreground it writes to standard output, which is what was wanted.
Foreground yes
LogTime yes
LogSyslog no

DatabaseDirectory /var/lib/clamav
DatabaseOwner clamav

# Twelve times a day, which is ClamAV's own recommendation and comfortably
# inside the forty-eight hour age policy: an outage has to last two days
# before it stops this worker scanning, and twenty-four attempts have to
# have failed before it does.
Checks 12

DatabaseMirror database.clamav.net

# Tell clamd the moment new signatures land, so the definition epoch the
# worker records changes as soon as the database does rather than at the
# next restart.
NotifyClamd /etc/clamav/clamd.conf

# A mirror that is slow is not a mirror that is down; give it room before
# giving up, and let s6 restart this service rather than looping in here.
ConnectTimeout 60
ReceiveTimeout 120
MaxAttempts 3
