# clamd, as this worker needs it.
#
# The worker speaks the socket protocol and streams objects in with
# INSTREAM, so there is no shared filesystem between the two and no path in
# any message — which is what keeps ADR-0006's "no local upload storage"
# rule true by construction rather than by a cleanup path.

# Supervised by s6, so it stays in the foreground.
#
# No LogFile, deliberately. clamd in the foreground writes to standard
# output, which is where a container's logs belong; pointing it at
# /dev/stdout instead fails outright with "too many levels of symbolic
# links", because that path is itself a symlink chain into the process's own
# file descriptors and clamd opens it by name.
Foreground yes
LogTime yes
LogSyslog no

# Reached over TCP on the loopback interface only. Nothing outside the
# container can talk to the scanner, and nothing needs to.
TCPSocket 3310
TCPAddr 127.0.0.1

# No LocalSocket at all. The worker speaks TCP, and the Unix socket is one
# more thing to exist: clamd drops to the clamav user before binding it, so
# it also needs a directory under /run created and owned for it, which is a
# start-up failure waiting to be discovered the first time this runs as a
# different user. freshclam's NotifyClamd reaches clamd over the TCP socket
# above instead.

User clamav

# Limits. StreamMaxLength must be at least MAX_FILE_BYTES or clamd refuses
# an object the worker was willing to read, which reads as an unsupported
# payload rather than as a configuration mistake. 64 MiB leaves room above
# the worker's 10 MiB default for it to be raised without touching this.
StreamMaxLength 64M
MaxScanSize 128M
MaxFileSize 64M
MaxRecursion 10
MaxFiles 1000
MaxScanTime 120000

# Archive and document handling stays on: a roster export is text, but the
# image estate includes formats that embed other formats, and refusing to
# look inside them would be a scanner that cannot see what it is scanning.
ScanArchive yes
ScanPE yes
ScanELF yes
ScanOLE2 yes
ScanPDF yes
ScanHTML yes
ScanSWF yes

# Heuristics that report rather than refuse. Encrypted archives and
# documents cannot be scanned, so they are treated as detections: an
# unscannable payload must never reach an affirmative clean verdict.
AlertEncrypted yes
AlertEncryptedArchive yes
AlertEncryptedDoc yes
AlertBrokenExecutables yes
AlertOLE2Macros no

# Reload the signature database in place rather than beside itself, and this
# line is what the instance is sized by.
#
# With `yes`, clamd builds the new database while still holding the old one
# and scans carry on throughout. Measured on this image, that takes it from
# 960 MiB to **2,022 MiB** for the length of the reload — which means paying
# for 4 GiB to cover a spike that happens twelve times a day.
#
# With `no`, memory stays flat at about 1,068 MiB through a reload and the
# instance fits in 2 GiB. The cost is that scans wait while the database is
# reloaded. With one worker that is a short pause twelve times a day and the
# queue simply holds, which is the cheaper end of a trade nobody upstream is
# waiting on. ADR-0020.
ConcurrentDatabaseReload no
